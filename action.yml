name: AI Code Review with Conductor
description: AI code review for pull requests with Claude, GitHub Copilot or any OpenAI-compatible gateway (BYOK)
author: Apperture-Dev
branding:
  icon: eye
  color: purple

inputs:
  github-token:
    description: Token that publishes the comments; it never reaches the AI agents
    default: ${{ github.token }}
  provider:
    description: claude, copilot or gateway
    default: claude
  model:
    description: Model for every agent; empty uses claude-sonnet-5-5 with Claude and the account default with Copilot; required with gateway
    default: ""
  gateway-url:
    description: Base URL of an OpenAI-compatible endpoint (chat/completions) for provider gateway, e.g. https://gateway.example.com/v1
    default: ""
  language:
    description: Language of the comments (en, es, ...)
    default: en
  rules-files:
    description: Comma-separated repository files with project rules the review must enforce
    default: AGENTS.md,CLAUDE.md,REVIEW.md
  extra-instructions:
    description: Extra free-text instructions for the reviewers
    default: ""
  exclude-paths:
    description: Comma-separated glob patterns of files that are not reviewed
    default: "*.lock,package-lock.json,pnpm-lock.yaml,go.sum,vendor/*,node_modules/*,dist/*,build/*,*.min.js,*.min.css,*.map,*.svg"
  max-findings:
    description: Maximum number of published findings (most severe first)
    default: "20"
  max-diff-chars:
    description: Larger diffs are truncated at file boundaries
    default: "150000"
  output-dir:
    description: Where findings.json, the context and the Conductor log are written, relative to the workspace
    default: reviewer-output

runs:
  using: docker
  image: docker://registry.gitlab.com/apperturedev/reviewer-workflow:1.6.0
  env:
    REVIEWER_GITHUB_TOKEN: ${{ inputs.github-token }}
    REVIEWER_PROVIDER: ${{ inputs.provider }}
    REVIEWER_MODEL: ${{ inputs.model }}
    COPILOT_PROVIDER_BASE_URL: ${{ inputs.gateway-url }}
    REVIEWER_LANGUAGE: ${{ inputs.language }}
    REVIEWER_RULES_FILES: ${{ inputs.rules-files }}
    REVIEWER_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
    REVIEWER_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
    REVIEWER_MAX_FINDINGS: ${{ inputs.max-findings }}
    REVIEWER_MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
    REVIEWER_OUTPUT_DIR: ${{ inputs.output-dir }}
